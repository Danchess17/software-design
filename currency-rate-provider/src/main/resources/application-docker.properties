# Профиль docker: паритет с prod — те же ключи, значения из окружения (фактор X).
# Запуск: SPRING_PROFILES_ACTIVE=docker (см. docker-compose-apps.yml).

spring.cloud.zookeeper.connect-string=${SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING:zookeeper:2181}
spring.cloud.zookeeper.discovery.instance-host=${SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST:currency-rate-provider}
server.port=${SERVER_PORT:8080}
grpc.server.port=${GRPC_SERVER_PORT:9090}
spring.cloud.zookeeper.discovery.metadata.gRPC_port=${SPRING_CLOUD_ZOOKEEPER_DISCOVERY_METADATA_GRPC_PORT:9090}
