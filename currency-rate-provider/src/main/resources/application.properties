# Application name - used as service name in ZooKeeper
spring.application.name=currency-rate-provider

# gRPC server port
grpc.server.port=9090

# HTTP port (needed for Zookeeper registration lifecycle)
server.port=8080

# ZooKeeper connection
spring.cloud.zookeeper.connect-string=localhost:2181

# Explicit host for registration (localhost for discovery on same machine)
spring.cloud.zookeeper.discovery.instance-host=127.0.0.1

# gRPC port in metadata - discovery clients use this to connect
spring.cloud.zookeeper.discovery.metadata.gRPC_port=9090
