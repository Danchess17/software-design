# Prometheus + Grafana + ZooKeeper + JMX Exporter для JVM-метрик ZK.
# Spring-приложения (client, service1, service2) запускаются на хосте; Prometheus ходит на host.docker.internal.
#
# Запуск: docker compose -f docker-compose-monitoring.yml up -d
# Grafana: http://localhost:3000 (admin / admin)
# Prometheus: http://localhost:9092

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: sd-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.3
    container_name: sd-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  zookeeper:
    image: zookeeper:3.8
    container_name: sd-zookeeper
    ports:
      - "2181:2181"
    environment:
      JVMFLAGS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9010
        -Dcom.sun.management.jmxremote.rmi.port=9010
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=zookeeper

  zookeeper-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: sd-zookeeper-jmx-exporter
    ports:
      - "9404:5556"
    volumes:
      - ./monitoring/jmx-exporter/zookeeper.yml:/config/zookeeper.yml:ro
    command:
      - "5556"
      - "/config/zookeeper.yml"
    depends_on:
      - zookeeper
    restart: on-failure
