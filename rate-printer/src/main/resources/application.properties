# Application name
spring.application.name=rate-printer

# HTTP + Actuator (Micrometer Prometheus). Port must not clash with providers (8080, 8081).
server.port=8082

# ZooKeeper connection
spring.cloud.zookeeper.connect-string=localhost:2181

# gRPC client - use discovery to find currency-rate-provider instances with load balancing
grpc.client.currencyRateProvider.address=discovery:///currency-rate-provider
grpc.client.currencyRateProvider.negotiationType=PLAINTEXT
grpc.client.currencyRateProvider.loadBalancingPolicy=round_robin

# Идентификатор для x-client-id и метрик сервера (RPS/latency по клиентам)
grpc.observability.client-id=client

# Actuator + Micrometer Prometheus (Grafana JVM Micrometer dashboard)
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=client

# IX — graceful shutdown (HTTP + планировщик)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
