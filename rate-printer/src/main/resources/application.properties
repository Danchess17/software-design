# Application name
spring.application.name=rate-printer

# ZooKeeper connection
spring.cloud.zookeeper.connect-string=localhost:2181

# gRPC client - use discovery to find currency-rate-provider instances with load balancing
grpc.client.currencyRateProvider.address=discovery:///currency-rate-provider
grpc.client.currencyRateProvider.negotiationType=PLAINTEXT
grpc.client.currencyRateProvider.loadBalancingPolicy=round_robin
